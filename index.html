<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพัสดุครุภัณฑ์ 241</title>
    <style>
        /* รีเซ็ตค่าขอบหน้าจอ เพื่อให้แอปเต็มจอ 100% ไม่มีขอบขาว */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* ป้องกันแถบสครอลบาร์ซ้อนกัน 2 ชั้น */
            background-color: #f4f6f8;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- เปลี่ยน src เป็นลิงก์ Web App ของคุณ -->
    <iframe src="https://script.google.com/macros/s/AKfycbxOhLVrZcMgmTBVT7kPyvlJGsKtW5qp8YGeLDYbD-Dd2DBISW_SoPKPKynBkQiQGQux9A/exec" allow="camera"></iframe>
